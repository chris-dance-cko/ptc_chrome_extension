<!DOCTYPE html>
<html>

<head>
  <title>Extension</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --border: #e6e6ec;
      --text: #1c1c22;
      --muted: #86868f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      padding: 18px 16px 24px;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    h3 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 22px 0 10px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #f2f2f6;
      border-color: #d4d4dc;
    }

    button:active {
      transform: scale(0.99);
    }

    button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.active:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    #lassoStatus,
    #dlqStatus {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 16px;
    }

    #dlqResults {
      margin-bottom: 10px;
    }

    #qaBox {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    #qaLabel {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
      word-break: break-all;
    }

    #qaVersion {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
    }

    #qaVersion a {
      color: var(--accent);
      text-decoration: none;
    }

    #qaVersion a:hover {
      text-decoration: underline;
    }

    #qaUpdated {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    .dlq-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .dlq-item a {
      font-size: 12px;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .dlq-item a:hover {
      text-decoration: underline;
    }

    .dlq-item-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      word-break: break-word;
    }

    textarea,
    input[type="text"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus,
    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      height: 200px;
      overflow-y: auto;
    }

    #promptsPanel,
    #tabGroupsPanel {
      display: none;
      margin-bottom: 10px;
    }

    #promptsPanel.open,
    #tabGroupsPanel.open {
      display: block;
    }

    #promptList {
      margin-bottom: 8px;
    }

    .prompt-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .prompt-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .prompt-item-name {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 6px;
    }

    .tab-group-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .tab-group-item .drag-handle {
      flex-shrink: 0;
      cursor: grab;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      padding: 2px 2px 0;
      user-select: none;
    }

    .tab-group-item .tab-group-item-body {
      flex: 1;
      min-width: 0;
    }

    .tab-group-item.dragging {
      opacity: 0.4;
    }

    .tab-group-item.drag-over-top {
      box-shadow: inset 0 2px 0 0 var(--accent);
    }

    .tab-group-item.drag-over-bottom {
      box-shadow: inset 0 -2px 0 0 var(--accent);
    }

    .prompt-item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .prompt-item-actions button {
      display: inline;
      width: auto;
      margin: 0;
      padding: 3px 10px;
      font-size: 11px;
    }

    .prompt-item textarea {
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical;
      min-height: 50px;
    }

    #addPromptForm {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    #addPromptForm input[type="text"],
    #addPromptForm textarea,
    #addTabGroupForm input[type="text"],
    #addTabGroupForm select {
      margin-bottom: 6px;
    }

    #addPromptForm textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 70px;
      resize: vertical;
    }

    #addPromptForm button,
    #addTabGroupForm button {
      width: auto;
      display: inline-block;
      padding: 7px 16px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <h3 style="margin: 0 0 6px;">QA Version</h3>
  <div id="qaBox">
    <div id="qaLabel">ptc_payout_authorize_v2_pipeline</div>
    <div id="qaVersion">Loading&hellip;</div>
    <div id="qaUpdated"></div>
  </div>
  <button id="qaRefresh">Refresh</button>
  <hr>
  <button id="refreshAll">Refresh All Tabs</button>
  <button id="scrapeTitles">Log All Tab Titles</button>
  <!-- <button id="clearStorage">Clear Local Data</button> -->
  <button id="harnessOpen">Open Recent Harness Executions</button>
  <hr>
  <h3 style="margin: 10px 0 6px;">Retool PTC DLQ → Datadog</h3>
  <textarea id="dlqPaste" placeholder="Paste the Retool DLQ response JSON here…"
    style="min-height:80px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:8px; resize:vertical;"></textarea>
  <button id="dlqParse">Parse JSON → Datadog Links</button>
  <div id="dlqStatus"></div>
  <div id="dlqResults"></div>
  <hr>
  <h3 style="margin: 10px 0 6px;">LLM Lasso</h3>
  <button id="lassoToggle">Select Element</button>
  <div id="lassoStatus"></div>
  <hr>
  <h3 style="margin: 10px 0 6px;">Tab Grouping</h3>
  <button id="tabGroupsToggle">Show Tab Groups</button>
  <div id="tabGroupsPanel">
    <div id="tabGroupList"></div>
    <div id="addTabGroupForm">
      <input type="text" id="newRulePattern" placeholder="URL contains… (e.g. datadoghq.com)">
      <input type="text" id="newRuleTitle" placeholder="Group name (optional)">
      <select id="newRuleColor">
        <option value="grey">Grey</option>
        <option value="blue">Blue</option>
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
        <option value="pink">Pink</option>
        <option value="purple">Purple</option>
        <option value="cyan">Cyan</option>
        <option value="orange">Orange</option>
      </select>
      <button id="addTabGroupRule">Add Rule</button>
    </div>
  </div>
  <hr>
  <h3 style="margin: 10px 0 6px;">Prompts</h3>
  <button id="promptsToggle">Show Prompts</button>
  <div id="promptsPanel">
    <div id="promptList"></div>
    <div id="addPromptForm">
      <input type="text" id="newPromptName" placeholder="Name">
      <textarea id="newPromptText" placeholder="Prompt text…"></textarea>
      <button id="savePrompt">Save</button>
    </div>
  </div>
  <hr>
  <div id="log">Logs will appear here...</div>
  <script src="turndown.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
