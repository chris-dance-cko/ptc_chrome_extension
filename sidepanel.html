<!DOCTYPE html>
<html>

<head>
  <title>Extension</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --border: #e6e6ec;
      --text: #1c1c22;
      --muted: #86868f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      padding: 18px 16px 24px;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    h3 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 22px 0 10px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #f2f2f6;
      border-color: #d4d4dc;
    }

    button:active {
      transform: scale(0.99);
    }

    #dlqStatus {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 16px;
    }

    #dlqResults {
      margin-bottom: 10px;
    }

    .dlq-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .dlq-item a {
      font-size: 12px;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .dlq-item a:hover {
      text-decoration: underline;
    }

    .dlq-item-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      word-break: break-word;
    }

    textarea,
    input[type="text"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus,
    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #tabGroupsPanel,
    #autoClosePanel {
      display: none;
      margin-bottom: 10px;
    }

    #tabGroupsPanel.open,
    #autoClosePanel.open {
      display: block;
    }

    .prompt-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .prompt-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .prompt-item-name {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 6px;
    }

    .tab-group-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .tab-group-item .drag-handle {
      flex-shrink: 0;
      cursor: grab;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      padding: 2px 2px 0;
      user-select: none;
    }

    .tab-group-item .tab-group-item-body {
      flex: 1;
      min-width: 0;
    }

    .tab-group-item.dragging {
      opacity: 0.4;
    }

    .tab-group-item.drag-over-top {
      box-shadow: inset 0 2px 0 0 var(--accent);
    }

    .tab-group-item.drag-over-bottom {
      box-shadow: inset 0 -2px 0 0 var(--accent);
    }

    .prompt-item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .prompt-item-actions button {
      display: inline;
      width: auto;
      margin: 0;
      padding: 3px 10px;
      font-size: 11px;
    }

    #addTabGroupForm input[type="text"],
    #addTabGroupForm select,
    #addAutoCloseForm input[type="text"] {
      margin-bottom: 6px;
    }

    #addTabGroupForm button,
    #addAutoCloseForm button {
      width: auto;
      display: inline-block;
      padding: 7px 16px;
      margin-bottom: 0;
    }

    .auto-close-item-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
    }
  </style>
</head>

<body>
  <h3 style="margin: 0 0 6px;">Retool PTC DLQ → Datadog</h3>
  <textarea id="dlqPaste" placeholder="Paste the Retool DLQ response JSON here…"
    style="min-height:80px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:8px; resize:vertical;"></textarea>
  <button id="dlqParse">Parse JSON → Datadog Links</button>
  <div id="dlqStatus"></div>
  <div id="dlqResults"></div>
  <hr>
  <h3 style="margin: 10px 0 6px;">Tab Grouping</h3>
  <button id="tabGroupsToggle">Show Tab Groups</button>
  <div id="tabGroupsPanel">
    <div id="tabGroupList"></div>
    <div id="addTabGroupForm">
      <input type="text" id="newRulePattern" placeholder="URL contains… (e.g. datadoghq.com)">
      <input type="text" id="newRuleTitle" placeholder="Group name (optional)">
      <select id="newRuleColor">
        <option value="grey">Grey</option>
        <option value="blue">Blue</option>
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
        <option value="pink">Pink</option>
        <option value="purple">Purple</option>
        <option value="cyan">Cyan</option>
        <option value="orange">Orange</option>
      </select>
      <button id="addTabGroupRule">Add Rule</button>
    </div>
  </div>
  <hr>
  <h3 style="margin: 10px 0 6px;">Auto-Close Tabs</h3>
  <button id="autoCloseToggle">Show Auto-Close Rules</button>
  <div id="autoClosePanel">
    <div id="autoCloseList"></div>
    <div id="addAutoCloseForm">
      <input type="text" id="newCloseRulePattern" placeholder="URL contains… (e.g. example.com/checkout)">
      <input type="text" id="newCloseRuleDelay" placeholder="Close after seconds… (e.g. 300)">
      <button id="addAutoCloseRule">Add Rule</button>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>

</html>
